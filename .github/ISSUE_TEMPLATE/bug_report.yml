name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time! Please remove passwords and serial numbers from logs before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: huawei2mqtt version
      description: Shown in the portal under Settings → System (e.g. 1.0.0)
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter model and dongle
      placeholder: e.g. SUN2000-10KTL-M1 with SDongleA-05
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [amd64, arm64 (Raspberry Pi 64-bit), other]
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Portal → Log, or `docker logs huawei2mqtt`
      render: text
